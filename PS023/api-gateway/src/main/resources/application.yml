server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates: [Path=/api/auth/**]
            - id: member-service
              uri: lb://MEMBER-SERVICE
              predicates: [Path=/api/members/**]
            - id: subscription-service
              uri: lb://SUBSCRIPTION-SERVICE
              predicates: [Path=/api/subscriptions/**]
            - id: attendance-service
              uri: lb://ATTENDANCE-SERVICE
              predicates: [Path=/api/attendance/**]
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
